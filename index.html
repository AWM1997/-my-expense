@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap');
:root{color-scheme:light}*{box-sizing:border-box}body{font-family:'Prompt',system-ui,sans-serif;background:#f4f6fb;color:#17253c}.wrap{max-width:850px;padding:38px 22px 90px}h1{font-size:28px;letter-spacing:-.9px;margin-bottom:26px}.logo{background:linear-gradient(135deg,#4e68ed,#8b67ed);border-radius:16px;width:50px;height:50px;box-shadow:0 10px 22px #526ae63b}.version{background:#e9edfa;padding:7px 11px;border-radius:30px;color:#697b9c}.card{border:1px solid #edf0f8;box-shadow:0 15px 35px #1e355012;border-radius:24px;padding:26px;margin-bottom:18px}.tabs{background:#f2f4fb;border-radius:16px;padding:6px}.tabs button{color:#68758b;font-size:15px}.tabs button.active{background:#fff;color:#4059d9;box-shadow:0 5px 16px #253d6e19}.hero{background:linear-gradient(125deg,#243c87,#4d55cb 63%,#7e6be5);color:#fff;position:relative;overflow:hidden;border:0;box-shadow:0 18px 38px #4055ba35}.hero:after{content:'✦';position:absolute;right:28px;top:-47px;font-size:180px;opacity:.08;pointer-events:none}.hero .muted{color:#d9defd}.hero .total{color:#fff;font-size:clamp(38px,7vw,58px);margin:4px 0 18px}.hero .filters{margin-top:10px}.hero .filters label{color:#e1e6ff}.hero .filters input{background:#ffffffed;border:0}.hero .small{background:#ffffff2e;color:white;border:1px solid #ffffff5c}.formtitle{font-weight:700;font-size:18px;margin-bottom:16px}.fields{gap:14px}label{font-size:13px;font-weight:500;color:#60708a}input{border:1px solid #e3e8f3;background:#fafbff;padding:16px;border-radius:14px}input:focus{outline:3px solid #dce3ff;border-color:#6278ec}.primary{background:linear-gradient(110deg,#5668e9,#7b63df);border-radius:15px;box-shadow:0 9px 22px #5968e93b;padding:17px}.primary:hover{background:linear-gradient(110deg,#4356dc,#6e50d4)}.history strong{font-size:18px}.entry{border-top:1px solid #eef1f8;padding:17px 0}.entry .name{font-weight:600}.entry .name:before{content:'↗';display:inline-grid;place-items:center;background:#eff1ff;color:#6170e5;border-radius:12px;width:36px;height:36px;margin-right:12px}.amount{color:#d64f68}.small{background:#f1f3fa;color:#53627d}.danger{background:#fff0f3;border:1px solid #ffdae2;color:#c83758}.foot{justify-content:center}.foot button{background:#e9edf8}.empty{padding:42px 0}.overview{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}.metric{background:white;border-radius:20px;padding:19px 22px;border:1px solid #edf0f8;box-shadow:0 10px 28px #1e35500b}.metric small{color:#7b879c;font-size:12px}.metric strong{display:block;font-size:24px;margin-top:4px;color:#25365c}.metric span{font-size:19px;margin-right:6px}.subtle-note{text-align:center}.pill{font-size:12px;color:#68768c;background:#f0f3f9;padding:6px 10px;border-radius:40px}@media(max-width:560px){.wrap{padding:20px 12px 60px}h1{font-size:23px}.card{padding:19px;border-radius:21px}.overview{gap:9px}.metric{padding:14px}.metric strong{font-size:19px}.entry .name:before{width:29px;height:29px;margin-right:7px}.fields{grid-template-columns:1.2fr 1fr}.version{font-size:10px}.hero .total{font-size:42px}}
</style></head><body><main class="wrap"><h1><span class="logo">✦</span> รายจ่ายของฉัน <small class="version">MY EXPENSE • V1.7</small></h1><div class="card"><div class="tabs"><button class="active" data-account="personal">👤 ส่วนตัว</button><button data-account="business">🏪 ธุรกิจ</button></div></div><div class="card hero"><div class="muted">✦ ยอดใช้จ่ายของวันที่เลือก</div><div class="total" id="total">0 บาท</div><div class="filters"><label for="day" style="margin:0">วันที่</label><input type="date" id="day"><button class="small" id="today">วันนี้</button></div></div><div class="overview"><div class="metric"><small>📅 รายจ่ายเดือนนี้</small><strong id="monthly">0 บาท</strong></div><div class="metric"><small>🧾 จำนวนรายการทั้งหมด</small><strong id="allcount">0 รายการ</strong></div></div><form class="card" id="form"><div class="formtitle">✍️ เพิ่มรายจ่ายใหม่</div><div class="fields"><div><label for="name">จ่ายค่าอะไร</label><input id="name" placeholder="" maxlength="120" required autocomplete="off"></div><div><label for="money">กี่บาท</label><input id="money" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="" required></div></div><div id="editHint">กำลังแก้ไขรายการ</div><button class="primary" id="save" type="submit">+ เพิ่มรายจ่าย</button><button class="small" type="button" id="cancel" style="display:none;width:100%;margin-top:8px">ยกเลิกแก้ไข</button></form><div class="card history"><div class="top"><strong>📋 รายการรายจ่าย</strong><span class="muted" id="count"></span></div><div id="entries"></div></div><div class="foot"><button id="export">⬇ ส่งออก CSV</button><button id="backup">สำรองข้อมูล JSON</button><button id="restore">นำเข้าข้อมูล JSON</button><input type="file" id="file" accept="application/json,.json" hidden></div><p class="muted">🔒 ข้อมูลเก็บในเบราว์เซอร์เครื่องนี้ กรุณาสำรองข้อมูลเป็นระยะ</p></main><script>
(()=>{'use strict';const KEY='myexpense_simple_expenses_v13',oldKey='myexpense_simple_expenses_v13';const $=id=>document.getElementById(id);const localDate=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let account='personal',editId=null;let items=[];try{const parsed=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(parsed))items=parsed.filter(x=>x&&typeof x.name==='string'&&Number.isFinite(Number(x.amount))&&Number(x.amount)>0&&['personal','business'].includes(x.account)&&/^\d{4}-\d{2}-\d{2}$/.test(x.date))}catch(e){alert('ไม่สามารถอ่านข้อมูลเดิมได้ กรุณาตรวจสอบข้อมูลสำรอง')}const save=()=>localStorage.setItem(KEY,JSON.stringify(items));const money=n=>Number(n).toLocaleString('th-TH',{maximumFractionDigits:2})+' บาท';$('day').value=localDate();function reset(){editId=null;$('form').reset();$('editHint').style.display='none';$('cancel').style.display='none';$('save').textContent='+ เพิ่มรายจ่าย'}function render(){document.querySelectorAll('[data-account]').forEach(b=>b.classList.toggle('active',b.dataset.account===account));const shown=items.filter(x=>x.account===account&&x.date===$('day').value).sort((a,b)=>b.created-a.created);$('total').textContent=money(shown.reduce((s,x)=>s+Number(x.amount),0));$('count').textContent=shown.length+' รายการ';$('monthly').textContent=money(items.filter(x=>x.account===account&&x.date.slice(0,7)===$('day').value.slice(0,7)).reduce((s,x)=>s+Number(x.amount),0));$('allcount').textContent=items.filter(x=>x.account===account).length+' รายการ';const target=$('entries');target.replaceChildren();if(!shown.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='ยังไม่มีรายจ่ายวันนี้';target.append(empty)}for(const x of shown){const line=document.createElement('div');line.className='entry';const name=document.createElement('span');name.className='name';name.textContent=x.name;const amount=document.createElement('span');amount.className='amount';amount.textContent=money(x.amount);const edit=document.createElement('button');edit.className='small';edit.textContent='แก้ไข';edit.onclick=()=>{editId=x.id;$('name').value=x.name;$('money').value=x.amount;$('editHint').style.display='block';$('cancel').style.display='block';$('save').textContent='บันทึกการแก้ไข';$('name').focus();window.scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.className='small danger';del.textContent='🗑 ลบ';del.onclick=()=>{if(confirm('ต้องการลบ '+x.name+' จำนวน '+money(x.amount)+' ใช่ไหม?')){const previous=items;items=items.filter(y=>y.id!==x.id);try{save()}catch(err){items=previous;alert('ลบรายการไม่สำเร็จ');return}if(editId===x.id)reset();render()}};line.append(name,amount,edit,del);target.append(line)}}document.querySelectorAll('[data-account]').forEach(b=>b.onclick=()=>{account=b.dataset.account;reset();render()});$('day').onchange=()=>{reset();render()};$('today').onclick=()=>{$('day').value=localDate();reset();render()};$('cancel').onclick=reset;$('form').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim(),amount=Number($('money').value);if(!name||!Number.isFinite(amount)||amount<=0||amount>1e12){alert('กรุณากรอกรายการและจำนวนเงินที่ถูกต้อง');return}const snapshot=JSON.stringify(items);if(editId){const x=items.find(x=>x.id===editId);if(x){x.name=name;x.amount=amount}}else{items.push({id:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),account,date:$('day').value,name,amount,created:Date.now()})}try{save()}catch(err){items=JSON.parse(snapshot);alert('บันทึกไม่สำเร็จ พื้นที่เก็บข้อมูลอาจเต็ม');return}reset();render()};function download(text,filename,type){const url=URL.createObjectURL(new Blob(['\ufeff',text],{type}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('export').onclick=()=>{const rows=[['วันที่','บัญชี','รายการ','จำนวนเงิน'],...items.map(x=>[x.date,x.account==='personal'?'ส่วนตัว':'ธุรกิจ',x.name,x.amount])];const csv=rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');download(csv,'รายจ่าย-'+localDate()+'.csv','text/csv;charset=utf-8')};$('backup').onclick=()=>download(JSON.stringify(items,null,2),'สำรองรายจ่าย-'+localDate()+'.json','application/json');$('restore').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!Array.isArray(parsed)||!parsed.every(x=>x&&typeof x.name==='string'&&Number.isFinite(Number(x.amount))&&Number(x.amount)>0&&['personal','business'].includes(x.account)&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&typeof x.id==='string'))throw Error('รูปแบบไม่ถูกต้อง');if(confirm('นำเข้าข้อมูลและแทนที่ข้อมูลทั้งหมดในเครื่องนี้ใช่ไหม?')){const previous=items;items=parsed;try{save();reset();render()}catch(err){items=previous;alert("นำเข้าไม่สำเร็จ") }}}catch(err){alert('ไฟล์สำรองไม่ถูกต้อง หรือไม่สามารถนำเข้าได้')}e.target.value=''};render()})();
</script></body></html>
